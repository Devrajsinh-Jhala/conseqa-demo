name: Offline demo checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export offline regression reports
        run: npm run contracts:test -- --json dist/regressions.json --junit dist/regressions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regressions-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/regressions.*
          if-no-files-found: ignore
